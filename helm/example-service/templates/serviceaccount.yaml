{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "example-service.serviceAccountName" . }}
  labels:
    {{- include "example-service.labels" . | nindent 4 }}
# Edge case: this same ServiceAccount is reused by every hook Job below.
# A real production chart should give hook Jobs their own narrower
# ServiceAccount + RBAC (e.g. the migration Job needs a DB Secret the
# app Deployment doesn't) rather than sharing one identity across both
# the long-running workload and one-shot release-time Jobs.
{{- end }}
