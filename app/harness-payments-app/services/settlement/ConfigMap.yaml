apiVersion: v1
kind: ConfigMap
metadata:
  name: pay-settlement-config
  labels:
    app: payments
    service: settlement
    release: "1.2.0"
data:
  SERVICE_NAME: pay-settlement
  APP_NAME: payments
  RELEASE_VERSION: "1.2.0"
  MODE: "async"
  RETRY_QUEUE: "kafka"
  SETTLEMENT_BATCH: "5000"
  LEDGER_SYNC: "realtime"
