apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay-ledger
  labels:
    app: payments
    service: ledger
    release: "1.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
      service: ledger
  template:
    metadata:
      labels:
        app: payments
        service: ledger
        release: "1.2.0"
    spec:
      containers:
        - name: ledger
          image: hellodk/echo-service:v1.2.0
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: pay-ledger
            - name: APP_NAME
              value: payments
            - name: RELEASE_VERSION
              value: "1.2.0"
            - name: IMAGE_TAG
              value: "v1.2.0"
          envFrom:
            - configMapRef:
                name: pay-ledger-config
            - secretRef:
                name: pay-ledger-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
